<!DOCTYPE html>
<html>
    <head>
        <title> Form </title>
        <meta charset="us-en">
        <meta name="viewport" content="width:device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 class="heading"> HTML Form</h1>
        <section class="form">

        <form>
            <fieldset> 
                <legend> Your Details : </legend> 
            <!--first name-->
            <label for="First Name"> First Name : </label>
                <input type="text" class="firstName" name="firstName" placeholder="Enter your First Name"><br> <br>
            <!--second name-->
                <label for="Second Name"> Second Name :</label>
                <input type="text" class="secondName" name="secondName" placeholder="Enter your Second Name"> <br>
            </fieldset><br>

            <fieldset> 
                <legend> Your Review : </legend> 
             <!--how did you hear about us------dropdown selection--->
                <label for="how_known"> How did you hear about us ?</label>
                <select class="how_known" name="how_known"> 
                    <option value="Google">Google</option>
                    <option value="Youtube"> Youtube </option>
                    <option value="Instagram"> Instagram </option>
                    <option value="What's up"> Whatsup </option>
                </select><br><br>
            <!-- would you visit again /yes or No-->
             <label for="Name"> Would you visit again ? </label><br>
                <input type="radio" class="yes" name="yes" value="yes">
                <label for="yes"> Yes </label>

                <input type="radio" class="no" name="no" value="no">
                <label for="no"> No </label>

                <input type="radio" class="maybe" name="maybe" value="maybe">
                <label for="maybe"> May be </label><br><br>

            <!-- Comments -->
                <label for="comments"> Comments: </label><br>
                <textarea cols="35" rows="5" class="comments" name="comments" form="comments"></textarea><br>

            <!-- check box-->
            <input type="checkbox" class="checkbox" name="checkbox"> 
            <label for="checkbox"> Sign me up for email updates </label><br><br>

            <input type="submit" class="submit" name="submit" value="SUBMIT">


            

       
            </form>

        </section>


    </body>
</html>
